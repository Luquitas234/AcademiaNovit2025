# Nombre del workflow, aparecerá en la interfaz de GitHub Actions
name: CI para Rama Development (DEV)

# Evento que dispara el workflow
# Se ejecutará cada vez que se haga un 'push' a la rama 'development'
on:
  push:
    branches:
      - development # Asegura que este workflow solo se ejecute para la rama 'development'

# Definición de los trabajos (jobs) que componen el workflow
jobs:
  # Primer trabajo: Compilar y Ejecutar Tests Unitarios
  build_and_test:
    # Sistema operativo en el que se ejecutará este trabajo
    runs-on: ubuntu-latest

    # Pasos que se ejecutarán en este trabajo
    steps:
      # Paso 1: Checkout del código fuente del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar el SDK de .NET
      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' 

      # Paso 3: Restaurar las dependencias del proyecto
      - name: Restaurar dependencias de NuGet
        run: dotnet restore

      # Paso 4: Compilar el proyecto
      - name: Compilar el proyecto
        run: dotnet build --no-restore

      # Paso 5: Ejecutar los tests unitarios
      - name: Ejecutar tests unitarios
        run: dotnet test --no-build --verbosity normal

      # Paso 6: Consumir un secret (ejemplo, solo para demostración de consumo)
      - name: Usar un Secret de GitHub (ejemplo)
        run: |
          echo "Secret de ejemplo (no mostrar valor real): ${{ secrets.MY_DUMMY_SECRET }}"

  # Segundo trabajo: Enviar Email de Notificación
  send_email_notification:
    # Este trabajo solo se ejecutará si 'build_and_test' ha finalizado con éxito
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Usar la acción 'action-send-mail'
      - name: Enviar notificación por email
        uses: dawidd6/action-send-mail@v3 # Usamos la acción de envío de correo
        with:
          server_address: app.debugmail.io
          server_port: 25
          username: ${{ secrets.DEBUGMAIL_SMTP_USERNAME }}
          password: ${{ secrets.DEBUGMAIL_SMTP_PASSWORD }}
          # Configuración del correo electrónico
          from: "GitHub Actions CI <no-reply@github.com>" 
          subject: "✅ CI Workflow Exitoso: ${{ github.ref_name }}"
          to: ${{ secrets.DEBUGMAIL_TO_EMAIL }}
          body: |
            El workflow de CI en la rama ${{ github.ref_name }} ha finalizado exitosamente en GitHub Actions.

            URL del Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secure: false
