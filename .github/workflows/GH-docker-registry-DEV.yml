# Nombre del workflow, aparecerá en la interfaz de GitHub Actions
name: Build & Push Docker Image to GHCR (DEV)

# Evento que dispara el workflow
# Se ejecutará cada vez que se haga un 'push' a la rama 'development'
on:
  push:
    branches:
      - development # Asegura que este workflow solo se ejecute para la rama 'development'

# Definición de variables de entorno para el workflow
env:
  # Ruta al directorio que contiene el Dockerfile (relativa a la raíz del repositorio)
  DOCKERFILE_CONTEXT: AcademiaNovit # Ajusta esto si tu Dockerfile no está en la raíz del proyecto Web API

# Definición de los trabajos (jobs)
jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso necesario para escribir en GitHub Container Registry

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Paso 3: Login en GitHub Container Registry (GHCR)
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Paso 4: Construir y Pushear la imagen Docker
      - name: Construir y Pushear imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.DOCKERFILE_CONTEXT }}
          push: true
          # ¡CAMBIO CRÍTICO AQUÍ! Convertimos el nombre completo del repositorio a minúsculas.
          tags: |
            ghcr.io/${{ github.repository | lower }}:latest
            ghcr.io/${{ github.repository | lower }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
