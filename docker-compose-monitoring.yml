# Versión de la sintaxis de Docker Compose
version: '3.8'

# Definición de los servicios de monitoreo
services:
  # Servicio para Node Exporter: Recolecta métricas del sistema operativo host
  nodeexporter:
    image: prom/node-exporter:latest # Imagen oficial de Node Exporter
    container_name: nodeexporter     # Nombre del contenedor
    ports:
      - "9100:9100"                  # Expone el puerto 9100 para que Prometheus pueda recolectar métricas
    volumes:
      - /proc:/host/proc:ro          # Monta /proc del host (solo lectura)
      - /sys:/host/sys:ro            # Monta /sys del host (solo lectura)
      - /:/host/rootfs:ro            # Monta la raíz del host (solo lectura)
    command:
      - '--path.proc=/host/proc'     # Configura Node Exporter para usar los montajes
      - '--path.sys=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)'
    restart: always                  # Siempre reinicia el contenedor si se detiene
    network_mode: host               # Permite a Node Exporter acceder a las métricas del host directamente

  # Servicio para cAdvisor: Recolecta métricas de los contenedores Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest # Imagen oficial de cAdvisor
    container_name: cadvisor               # Nombre del contenedor
    # No exponemos el puerto 8080 al host, Prometheus lo accederá internamente por la red Docker
    volumes:
      - /:/root:ro                         # Monta la raíz del host (solo lectura)
      - /var/run/docker.sock:/var/run/docker.sock:ro # Acceso al socket Docker para obtener métricas de contenedores
      - /sys:/sys:ro                       # Monta /sys del host (solo lectura)
      - /var/lib/docker/:/var/lib/docker:ro # Monta el directorio de Docker (solo lectura)
    restart: always                        # Siempre reinicia el contenedor
    # cAdvisor necesita privilegios para acceder a ciertas métricas del kernel
    privileged: true
    # Depende de que Docker esté corriendo en el host
    depends_on:
      - nodeexporter # Solo para asegurar el orden de inicio, no una dependencia funcional directa

  # Servicio para Prometheus: Recolecta y almacena las métricas
  prometheus:
    image: prom/prometheus:latest    # Imagen oficial de Prometheus
    container_name: prometheus       # Nombre del contenedor
    ports:
      - "9090:9090"                  # Expone el puerto 9090 para acceder a la UI de Prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro # Monta el archivo de configuración
      - prometheus_data:/prometheus # Volumen para persistir los datos de Prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml' # Especifica el archivo de configuración
      - '--storage.tsdb.path=/prometheus'              # Especifica la ruta de almacenamiento de datos
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: always                  # Siempre reinicia el contenedor
    depends_on:
      - nodeexporter                 # Prometheus necesita a Node Exporter para recolectar métricas del host
      - cadvisor                     # Prometheus necesita a cAdvisor para recolectar métricas de contenedores

  # Servicio para Grafana: Visualiza las métricas
  grafana:
    image: grafana/grafana:latest    # Imagen oficial de Grafana
    container_name: grafana          # Nombre del contenedor
    ports:
      - "3000:3000"                  # Expone el puerto 3000 para acceder a la UI de Grafana
    volumes:
      - grafana_data:/var/lib/grafana # Volumen para persistir los datos y configuraciones de Grafana
    restart: always                  # Siempre reinicia el contenedor
    depends_on:
      - prometheus                   # Grafana necesita a Prometheus como fuente de datos

# Definición de volúmenes para persistencia de datos
volumes:
  prometheus_data: # Volumen para los datos de Prometheus
  grafana_data:    # Volumen para los datos y configuraciones de Grafana
