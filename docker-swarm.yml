# Versión de la sintaxis de Docker Compose para Swarm
version: '3.8'

# Definición de los servicios que se desplegarán en el Swarm
services:
  # Servicio para la Web API
  webapi:
    # La imagen Docker que se usará para este servicio.
    image: ghcr.io/luquitas234/academianovit2025:latest
    
    # Mapeo de puertos: el puerto 8080 del host del Swarm se mapea al puerto 8080 del contenedor.
    ports:
      - "8080:8080"
    
    # Configuración de despliegue específica para Docker Swarm
    deploy:
      replicas: 5 # Número de réplicas de la Web API
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Variables de entorno para el contenedor de la Web API
    environment:
      - ASPNETCORE_URLS=http://+:8080
      # ¡CADENA DE CONEXIÓN CRÍTICA!
      # Ahora, el host de la base de datos es 'db', que es el nombre del servicio PostgreSQL
      # definido en este mismo archivo docker-swarm.yml.
      # Asegúrate de que 'datos', 'admin' y 'tivon1234' coincidan con la configuración que usas.
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=datos;Username=admin;Password=tivon1234
    
    # Asegura que el servicio 'db' (PostgreSQL) se inicie antes que 'webapi'.
    depends_on:
      - db

  # ¡NUEVO SERVICIO! Servicio para la base de datos PostgreSQL dentro del Swarm
  db:
    image: postgres:15-alpine # Usamos una imagen ligera y estable de PostgreSQL
    
    # Configuración de despliegue para el servicio de base de datos
    deploy:
      replicas: 1 # Generalmente, solo necesitas una réplica para la base de datos
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M # La base de datos puede necesitar más memoria
        reservations:
          cpus: '0.25'
          memory: 256M

    # Variables de entorno para configurar PostgreSQL
    # ¡AJUSTA ESTOS VALORES! DEBEN COINCIDIR con los de tu cadena de conexión en 'webapi'.
    environment:
      POSTGRES_DB: datos      # Nombre de la base de datos
      POSTGRES_USER: admin     # Usuario de la base de datos
      POSTGRES_PASSWORD: tivon1234 # Contraseña del usuario
    
    # Mapeo de puertos: Opcional, pero útil para acceder a la DB desde el host (ej. con pgAdmin)
    ports:
      - "5432:5432"
    
    # Persistencia de datos: Guarda los datos de la base de datos en un volumen Docker.
    # Esto evita que pierdas tus datos cada vez que el contenedor se detiene/reinicia.
    volumes:
      - db_data:/var/lib/postgresql/data

# Definición de volúmenes para persistencia de datos
volumes:
  db_data: # Volumen para los datos de PostgreSQL
