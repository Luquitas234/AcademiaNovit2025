# Versión de la sintaxis de Docker Compose
version: '3.8'

# Definición de los servicios (contenedores) que componen tu aplicación
services:
  # Servicio para tu Web API
  webapi:
    image: ghcr.io/luquitas234/academianovit2025:latest
    ports:
      - "8080:80" # Mapea el puerto 8080 del host al 80 del contenedor
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      # ¡CADENA DE CONEXIÓN ACTUALIZADA!
      # Ahora, el host es 'host.docker.internal' para conectar al PostgreSQL que corre en tu máquina host.
      # Asegúrate de que 'datos', 'admin' y 'tivon1234' coincidan con la configuración de tu PostgreSQL.
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=datos;Username=admin;Password=tivon1234 # <--- ¡AJUSTA ESTA CADENA DE CONEXIÓN!
    restart: always
    container_name: academianovit_webapi
